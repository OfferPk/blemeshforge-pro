<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162234"/>
      <stop offset="100%" stop-color="#0d1522"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="none" stroke="#243247" stroke-width="2"/>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#00E5FF" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675"/>
  </g>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="65" fill="#131c2e" stroke="#243247" stroke-width="1"/>
  <rect x="25" y="15" width="36" height="36" rx="8" fill="url(#cyanBlue)" filter="url(#glowCyan)"/>
  <text x="43" y="39" fill="#000" font-family="sans-serif" font-weight="900" font-size="19" text-anchor="middle">M</text>
  <text x="75" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5">BLEMeshForge Pro</text>
  <rect x="260" y="22" width="170" height="22" rx="4" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-width="1"/>
  <text x="345" y="37" fill="#00E5FF" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">BLUETOOTH MESH v1.1</text>

  <!-- Status Badges -->
  <rect x="940" y="20" width="105" height="26" rx="6" fill="#1a2333" stroke="#00E5FF" stroke-width="1"/>
  <text x="992" y="37" fill="#00E5FF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">PB-ADV BEARER</text>
  <rect x="1060" y="20" width="115" height="26" rx="6" fill="#1a2333" stroke="#00E676" stroke-width="1"/>
  <text x="1117" y="37" fill="#00E676" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">10/10 PASS (100%)</text>

  <!-- Left Card: PDU Synthesizer & Framing -->
  <rect x="30" y="85" width="560" height="555" rx="12" fill="url(#cardGrad)" stroke="#243247" stroke-width="1.5"/>
  <text x="50" y="120" fill="#00E5FF" font-family="sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">NETWORK LAYER PDU SYNTHESIZER</text>

  <!-- PDU Fields Layout -->
  <g transform="translate(50, 140)">
    <!-- Header Row -->
    <rect x="0" y="0" width="520" height="42" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="15" y="26" fill="#8da4be" font-family="sans-serif" font-size="12">IVI (1b): <tspan fill="#00E5FF" font-weight="700">0</tspan></text>
    <text x="85" y="26" fill="#8da4be" font-family="sans-serif" font-size="12">NID (7b): <tspan fill="#00E5FF" font-weight="700">0x68</tspan></text>
    <text x="180" y="26" fill="#8da4be" font-family="sans-serif" font-size="12">CTL: <tspan fill="#00E676" font-weight="700">0 (Access)</tspan></text>
    <text x="305" y="26" fill="#8da4be" font-family="sans-serif" font-size="12">TTL: <tspan fill="#FF9100" font-weight="700">7</tspan></text>
    <text x="390" y="26" fill="#8da4be" font-family="sans-serif" font-size="12">SEQ: <tspan fill="#00E5FF" font-weight="700">0x000100</tspan></text>

    <!-- Addressing Row -->
    <rect x="0" y="55" width="250" height="55" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="15" y="75" fill="#8da4be" font-family="sans-serif" font-size="11">SOURCE ADDRESS (SRC)</text>
    <text x="15" y="96" fill="#00E5FF" font-family="monospace" font-weight="700" font-size="14">0x1201 (Unicast Element)</text>

    <rect x="270" y="55" width="250" height="55" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="285" y="75" fill="#8da4be" font-family="sans-serif" font-size="11">DESTINATION ADDRESS (DST)</text>
    <text x="285" y="96" fill="#7C4DFF" font-family="monospace" font-weight="700" font-size="14">0xC001 (Group: Office Light)</text>

    <!-- Lower Transport / Access Row -->
    <rect x="0" y="125" width="520" height="75" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="15" y="148" fill="#8da4be" font-family="sans-serif" font-size="11">MODEL ACCESS PAYLOAD &amp; LOWER TRANSPORT</text>
    <text x="15" y="170" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Generic OnOff Set (OpCode 0x8202) -> Target: 1 (ON) | TID: 1</text>
    <text x="15" y="190" fill="#8da4be" font-family="monospace" font-size="11">Header: 0x6A (SEG=0, AKF=1, AID=0x2A) + TransMIC (4 Octets)</text>

    <!-- Synthesized Hex View -->
    <text x="0" y="230" fill="#8da4be" font-family="sans-serif" font-weight="700" font-size="11">SYNTHESIZED NETWORK PDU (22 OCTETS)</text>
    <rect x="0" y="240" width="520" height="60" rx="6" fill="#060910" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="15" y="275" fill="#00E5FF" font-family="monospace" font-weight="700" font-size="13" letter-spacing="1.5">68070001001201C0016A82020101AAAAAA55A055A0</text>

    <!-- BLE Advertising Frame -->
    <text x="0" y="325" fill="#8da4be" font-family="sans-serif" font-weight="700" font-size="11">PB-ADV BLE ADVERTISING PACKET (AD TYPE 0x2A - 26 OCTETS)</text>
    <rect x="0" y="335" width="520" height="60" rx="6" fill="#060910" stroke="#7C4DFF" stroke-width="1.5"/>
    <text x="15" y="370" fill="#E040FB" font-family="monospace" font-weight="700" font-size="12" letter-spacing="1">020106172A68070001001201C0016A82020101AAAAAA55A055A0</text>
  </g>

  <!-- Right Card: 10-Point Normative Auditor -->
  <rect x="610" y="85" width="560" height="555" rx="12" fill="url(#cardGrad)" stroke="#243247" stroke-width="1.5"/>
  <text x="630" y="120" fill="#00E676" font-family="sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">10-POINT NORMATIVE ZERO-TRUST AUDITOR</text>

  <g transform="translate(630, 140)">
    <!-- Rule 1 -->
    <rect x="0" y="0" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="0" width="4" height="34" fill="#00E676"/>
    <text x="15" y="22" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="22" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-01: PB-ADV Network PDU 29-Byte Limit (22B &lt;= 29B)</text>

    <!-- Rule 2 -->
    <rect x="0" y="42" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="42" width="4" height="34" fill="#00E676"/>
    <text x="15" y="64" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="64" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-02: Unicast Source Address Range (0x1201 is valid Unicast)</text>

    <!-- Rule 3 -->
    <rect x="0" y="84" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="84" width="4" height="34" fill="#00E676"/>
    <text x="15" y="106" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="106" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-03: Destination Address Non-Zero Check (0xC001 != 0x0000)</text>

    <!-- Rule 4 -->
    <rect x="0" y="126" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="126" width="4" height="34" fill="#00E676"/>
    <text x="15" y="148" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="148" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-04: TTL Hop Limit Compliance (0 &lt;= TTL=7 &lt;= 127)</text>

    <!-- Rule 5 -->
    <rect x="0" y="168" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="168" width="4" height="34" fill="#00E676"/>
    <text x="15" y="190" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="190" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-05: IVI 1-Bit Framing Compliance (IVI=0)</text>

    <!-- Rule 6 -->
    <rect x="0" y="210" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="210" width="4" height="34" fill="#00E676"/>
    <text x="15" y="232" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="232" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-06: Sequence Number Threshold (SEQ=0x000100 &lt; 0xC00000)</text>

    <!-- Rule 7 -->
    <rect x="0" y="252" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="252" width="4" height="34" fill="#00E676"/>
    <text x="15" y="274" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="274" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-07: NetMIC Length Alignment (CTL=0 -&gt; 4-Octet NetMIC)</text>

    <!-- Rule 8 -->
    <rect x="0" y="294" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="294" width="4" height="34" fill="#00E676"/>
    <text x="15" y="316" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="316" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-08: Segmentation Bounds (Unsegmented / SegN &lt;= 31)</text>

    <!-- Rule 9 -->
    <rect x="0" y="336" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="336" width="4" height="34" fill="#00E676"/>
    <text x="15" y="358" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="358" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-09: Relay Flooding Margin (TTL=7 allows mesh relay)</text>

    <!-- Rule 10 -->
    <rect x="0" y="378" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="378" width="4" height="34" fill="#00E676"/>
    <text x="15" y="400" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="400" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-10: SIG Model ID Alignment (0x1000 Generic OnOff)</text>
  </g>
</svg>
